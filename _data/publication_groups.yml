# - First-author papers are detected automatically.
# - Papers listed under `major` show under "Other major contributions", with the text as the
#   "Contrib:" note. Key them by arXiv ID (or by ADS bibcode if a paper has no arXiv ID).
# - Every other paper is left to the PDF CV (supporting contributions aren't listed on the page).
