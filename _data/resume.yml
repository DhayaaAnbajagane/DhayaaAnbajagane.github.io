    startDate: "2022-01-01"
    summary: >
      Lead a group of grad students, postdocs, and senior researchers in developing data-driven methods
      to calibrate the image data and processing pipelines for the Dark Energy Survey legacy dataset.
      Our group produced the largest synthetic, calibration catalog to date.
  - position: "Organizer, Broader Horizons seminar series"
    organization: "Astronomy and Astrophysics, University of Chicago"
    startDate: "2022-01-01"
    summary: >
      Lead a seminar series that invites former department alumni to visit and present their
      academic/industry experiences to our community.
  - position: "Graduate Representative, Committee on department community"
    organization: "Astronomy and Astrophysics, University of Chicago"
    startDate: "2022-01-01"
    summary: >
      Oversee a community-wide survey of the department, used to inform department policy changes.
      Lead procurement and development of department resources for our community, such as student
      guides, alumni lists, and professional development seminars.
  - position: "Volunteer lecturer"
    organization: "Lifelong Learning"
    startDate: "2023-01-01"
    endDate: "2023-12-31"
