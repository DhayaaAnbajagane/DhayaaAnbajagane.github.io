<!--
Example code for the CloudFlare mail protection script.
CloudFlare will inject this on every page, but due to Hydejack's push state approach to page loading,
it will only run on the initial page.
The snippet below will run the code on every `hy-push-state-load` event instead.
-->
<script>
  document.getElementById('_pushState').addEventListener('hy-push-state-load', function (e) {
    function e(e){
      (console.error?console.error:console.log).call(console,e)
    }

    function t(e){
      return l.innerHTML='<a href="'+e.replace(/"/g,"&quot;")+'"></a>',l.childNodes[0].getAttribute("href")
    }

    function r(e,t){
      var r=e.substr(t,2);return parseInt(r,16)
    }

    function n(e,n){
      for(var o="",c=r(e,n),a=n+2;a<e.length;a+=2){
        var l=r(e,a)^c;
        o+=String.fromCharCode(l)
      }
      return t(o)
    }

    var o="/cdn-cgi/l/email-protection#",
        c=".__cf_email__",
        a="data-cfemail",
        l=document.createElement("div");

    !function(){
      for(var t=document.getElementsByTagName("a"),r=0;r<t.length;r++)
        try{
          var c=t[r],a=c.href.indexOf(o);
          a>-1&&(c.href="mailto:"+n(c.href,a+o.length))
        }catch(t){
          e(t)
        }
    }(),
    function(){
      for(var t=document.querySelectorAll(c),r=0;r<t.length;r++)
        try{
          var o=t[r],l=n(o.getAttribute(a),0),i=document.createTextNode(l);
          o.parentNode.replaceChild(i,o)
        }catch(t){
          e(t)
        }
    }()
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"
  integrity="sha384-o0gqi06am9fKVfa/jWO8/UE7OxHG6t+fgq/XaASsuwT8OBsFcxN7YhjtqyTfIxtS"
  crossorigin="anonymous" defer></script>
<script>
  (function () {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var pushState = document.getElementById('_pushState');

    /* Figures are the `{:.lead}` images in page content; images inside links keep their link behavior. */
    function figures() {
      return Array.prototype.filter.call(document.querySelectorAll('#_main img.lead'), function (img) {
        return !img.closest('a');
      });
    }

    /* Click-to-zoom on figures. One medium-zoom instance for the whole visit: each page swap
       re-attaches the new figures, so no listeners pile up across navigations. */
    var zoom = null;
    function setupZoom() {
      if (!window.mediumZoom) return;
      if (!zoom) {
        zoom = mediumZoom({ margin: 24, background: 'var(--body-bg)' });
        /* Return keyboard focus to the figure once it's closed. */
        zoom.on('closed', function (e) { if (e.target && e.target.focus) e.target.focus({ preventScroll: true }); });
      }
      zoom.detach();
      var imgs = figures();
      zoom.attach(imgs);
      /* Figures can also be zoomed from the keyboard. */
      imgs.forEach(function (img) {
        img.setAttribute('tabindex', '0');
        img.setAttribute('role', 'button');
        img.setAttribute('aria-label', 'Enlarge figure' + (img.alt ? ': ' + img.alt : ''));
        img.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoom.open({ target: img }); }
        });
      });
    }

    /* Fade figures (and their captions) in as they scroll into view. The observer's first report
       for each element (made after layout and scroll restoration) decides whether to animate it:
       anything already on screen or above it is left alone, so nothing flickers. */
    var revealObserver = null;
    function revealAll() {
      document.querySelectorAll('#_main .reveal:not(.is-visible)').forEach(function (el) {
        el.classList.add('is-visible');
      });
    }
    function setupReveal() {
      if (revealObserver) revealObserver.disconnect();
      if (reduceMotion.matches || !('IntersectionObserver' in window) || location.hash) return;
      var decided = new WeakSet();
      revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var el = entry.target;
          if (!decided.has(el)) {
            decided.add(el);
            if (entry.boundingClientRect.top < window.innerHeight) revealObserver.unobserve(el);
            else el.classList.add('reveal');
            return;
          }
          if (entry.isIntersecting) {
            el.classList.add('is-visible');
            revealObserver.unobserve(el);
          }
        });
      }, { rootMargin: '0px 0px -10% 0px' });

      figures().forEach(function (img) {
        var block = img.closest('p');
        if (!block || block.closest('details')) return;
        var caption = block.nextElementSibling;
        var targets = caption && caption.classList.contains('figcaption') ? [block, caption] : [block];
        targets.forEach(function (el) { revealObserver.observe(el); });
      });
    }
    /* Near the bottom of a page, show anything still waiting (the -10% margin can't be reached there). */
    window.addEventListener('scroll', function () {
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) revealAll();
    }, { passive: true });

    /* Briefly highlight the heading you jump to (table of contents, section links, links from other pages). */
    function highlightTarget() {
      if (!location.hash) return;
      var el;
      try { el = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (err) { return; }
      if (!el || !el.closest('#_main')) return;
      el.classList.remove('is-target');
      void el.offsetWidth; /* restart the animation if it's the same heading again */
      el.classList.add('is-target');
      el.addEventListener('animationend', function () { el.classList.remove('is-target'); }, { once: true });
    }
    window.addEventListener('hashchange', highlightTarget);

    /* A single "Copied" toast, outside #_main so it survives push-state page swaps.
       aria-live lets screen readers announce it. */
    var toast = document.createElement('div');
    toast.className = 'copy-toast';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
    var toastTimer = null;

    function copyText(text, message, source) {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(text).then(function () {
        /* Clear first so screen readers announce the message again for a repeat copy. */
        toast.textContent = '';
        requestAnimationFrame(function () { toast.textContent = message; });
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('is-visible'); }, 1500);
        if (source) {
          source.classList.remove('copied');
          void source.offsetWidth; /* restart the flash */
          source.classList.add('copied');
        }
      });
    }

    /* Hydejack adds a `#` permalink to every heading; clicking it now also copies the section URL.
       Registered once on the document, since the permalinks are re-created on every page. */
    document.addEventListener('click', function (e) {
      var link = e.target.closest && e.target.closest('#_main a.permalink');
      if (!link) return;
      var url = location.origin + location.pathname + link.getAttribute('href');
      copyText(url, 'Link to section copied');
    });

    /* Data release pages: inline code (file names, HDF5 paths, column names) copies on click.
       A mouse/touch shortcut only: these aren't made keyboard stops (a data page has 100+ of them),
       and the text can still be selected and copied normally.
       Code inside links keeps its link behavior; code blocks already have Hydejack's copy button. */
    function setupCodeCopy() {
      if (location.pathname.indexOf('/data_release/') !== 0) return;
      document.querySelectorAll('#_main code').forEach(function (el) {
        if (el.closest('pre, a') || el.classList.contains('click-to-copy')) return;
        el.classList.add('click-to-copy');
        el.setAttribute('title', 'Click to copy');
        el.addEventListener('click', function () { copyText(el.textContent, 'Copied ' + el.textContent, el); });
      });
    }

    /* Jargon tooltips come from _includes/abbreviations.md (kramdown <abbr title>). Hydejack already
       shows them on click/tap; make them reachable from the keyboard too (Tab, then Enter/Space). */
    function setupAbbr() {
      document.querySelectorAll('#_main abbr[title]').forEach(function (el) {
        el.setAttribute('tabindex', '0');
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var el = e.target;
      if (el.matches && el.matches('#_main abbr[title]') && el._tippy) {
        e.preventDefault();
        el._tippy.show();
      }
    });

    /* BibTeX pop-up for the publication lists (_includes/my-pub-list.html). One <dialog> for the whole
       visit, outside #_main; each paper's "BibTeX" link opens the entry kept in its hidden <pre>
       (without the script, the link still goes to ADS's export page). Opening and closing fade and
       slide like the figures do: the `is-open` class drives the CSS transition, and the dialog is only
       closed once the fade-out has finished. The browser returns focus to the link on close. */
    var bibDialog = null;
    var bibCloseTimer = null;
    function closeBibtex(immediately) {
      if (!bibDialog || !bibDialog.open) return;
      bibDialog.classList.remove('is-open');
      clearTimeout(bibCloseTimer);
      if (immediately || reduceMotion.matches) bibDialog.close();
      else bibCloseTimer = setTimeout(function () { bibDialog.close(); }, 320);
    }
    function bibtexDialog() {
      if (bibDialog) return bibDialog;
      bibDialog = document.createElement('dialog');
      bibDialog.className = 'bibtex-dialog';
      bibDialog.setAttribute('aria-label', 'BibTeX entry');
      bibDialog.innerHTML =
        '<div class="bibtex-dialog-bar"><span class="bibtex-dialog-title">BibTeX</span>' +
        '<button type="button" class="bibtex-copy">Copy</button>' +
        '<button type="button" class="bibtex-close" aria-label="Close">×</button></div>' +
        '<pre class="bibtex-text"></pre>';
      document.body.appendChild(bibDialog);
      var copyBtn = bibDialog.querySelector('.bibtex-copy');
      var copyTimer = null;
      copyBtn.addEventListener('click', function () {
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(bibDialog.querySelector('.bibtex-text').textContent).then(function () {
          /* The page's toast would sit under the open dialog, so confirm on the button itself. */
          copyBtn.textContent = 'Copied';
          clearTimeout(copyTimer);
          copyTimer = setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        });
      });
      bibDialog.querySelector('.bibtex-close').addEventListener('click', function () { closeBibtex(); });
      /* Escape: animate the close instead of the browser's instant one. */
      bibDialog.addEventListener('cancel', function (e) { e.preventDefault(); closeBibtex(); });
      /* A click on the dimmed backdrop lands on the <dialog> element itself (its content fills the box). */
      bibDialog.addEventListener('click', function (e) { if (e.target === bibDialog) closeBibtex(); });
      return bibDialog;
    }
    document.addEventListener('click', function (e) {
      var link = e.target.closest && e.target.closest('#_main .bibtex-btn');
      if (!link) return;
      var item = link.closest('li');
      var src = item && item.querySelector('.bibtex-data');
      if (!src) return;
      e.preventDefault();
      var dlg = bibtexDialog();
      clearTimeout(bibCloseTimer);
      dlg.querySelector('.bibtex-text').textContent = src.textContent;
      dlg.querySelector('.bibtex-copy').textContent = 'Copy';
      if (!dlg.open) {
        if (dlg.showModal) dlg.showModal();
        else dlg.setAttribute('open', '');
      }
      /* Two frames so the closed state is painted before the transition to `is-open` starts. */
      requestAnimationFrame(function () { requestAnimationFrame(function () { dlg.classList.add('is-open'); }); });
    });

    function init() {
      setupZoom();
      setupReveal();
      setupCodeCopy();
      setupAbbr();
      highlightTarget();
    }

    /* Run on the first page view, then again after each Hydejack push-state page change. */
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
    if (pushState) {
      pushState.addEventListener('hy-push-state-load', init);
      /* Close an open zoomed figure when leaving the page. */
      pushState.addEventListener('hy-push-state-start', function () {
        if (zoom) zoom.close();
        closeBibtex(true);
      });
    }
  })();
</script>
